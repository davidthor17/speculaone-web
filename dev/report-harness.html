<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Report harness</title>
  <!--
    Local verification only. Drives the real report-result.js and
    report-render.js with hand-built rows so every report state can be seen
    without a network call, a Supabase client, or a published audit.
    Never linked from the site and excluded from the sitemap.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- The same three stylesheets, in the same order, as report.html. -->
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../report.css">
  <style>
    body { padding: 24px; }
    .harness-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .harness-bar button {
      padding: 7px 12px; font-size: 12px; cursor: pointer;
      background: transparent; color: var(--report-dim);
      border: 1px solid var(--report-border); border-radius: 3px;
    }
    .harness-bar button[aria-pressed="true"] { color: var(--report-gold); border-color: var(--report-gold); }
    #harness-state { font-family: monospace; font-size: 11px; color: var(--report-dim); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="harness-bar" id="harness-bar"></div>
  <div id="harness-state"></div>
  <div id="report-root"></div>

  <script type="module">
    import { interpretReport } from '../report-result.js';
    import { renderNotFound, renderUnsupported, renderReport } from '../report-render.js';

    const root = document.getElementById('harness-state').nextElementSibling;

    const payload = (over = {}) => ({
      formatVersion: 1,
      publishedAt: '2026-09-14T10:22:41.108Z',
      auditedOn: '2026-09-12',
      auditType: 'full',
      property: { name: 'Hotel Borealis', city: 'Reykjavik', country: 'Iceland', category: '5★' },
      score: { percent: 92, itemsMet: 110, itemsGraded: 120 },
      standardMet: true,
      summary: 'A calm, well run house with a genuinely warm arrival.',
      sections: [
        { id: 'pre', label: 'Pre-Arrival & Website', total: 12, met: 11, partial: 1, missed: 0, na: 0 },
        { id: 'room', label: 'Room Quality', total: 9, met: 8, partial: 1, missed: 0, na: 0 },
        { id: 'facilities', label: 'Facilities', total: 6, met: 5, partial: 0, missed: 1, na: 0 },
        { id: 'safety', label: 'Safety, Security & Integrity', total: 3, met: 3, partial: 0, missed: 0, na: 0 },
        { id: 'spa', label: 'Spa & Wellness', total: 11, met: 10, partial: 1, missed: 0, na: 0 },
      ],
      criticalFailures: [],
      basis: { state: 'frozen', recordedOn: '2026-09-12T08:14:00.000Z' },
      ...over,
    });

    const row = (over = {}) => ({
      id: 'a1', ref: 'AHP-2026-DEMO', date: '2026-09-12', status: 'published', tier: 'full',
      auditor_summary: 'LIVE SUMMARY, MUST NOT APPEAR ON A FROZEN REPORT',
      critical_failures: [{ itemId: 'LIVE-01', label: 'LIVE FAILURE, MUST NOT APPEAR' }],
      properties: { name: 'LIVE NAME, MUST NOT APPEAR', city: 'Nowhere', country: 'Nowhere', category: '4★' },
      published_result: payload(),
      ...over,
    });

    // The Phase 6.8 block, exactly as buildPublishedResult() emits it.
    const INTEL = () => ({
      headline: 'Mixed overall performance, with 2 high priority issues to address.',
      summary: {
        overallPerformance: 'Mixed',
        primaryConcern: 'High priority: No hair, stains, or odors',
        operationalPattern: '3 related failures recorded within Room Quality.',
        positiveSignal: 'Consistently strong performance in Pre-Arrival & Website',
      },
      keyMetrics: {
        urgentIssueCount: 2, priorityCount: 5, patternCount: 3,
        strengthCount: 1, notAssessedCount: 0, notAvailableCount: 0,
      },
      priorities: [
        { rank: 1, severity: 'high', title: 'High priority: No hair, stains, or odors', reason: 'Recorded in Room Quality as Missed. Ranked high priority.', findingCount: 1, sectionIds: ['room'], affectedSections: ['Room Quality'] },
        { rank: 2, severity: 'high', title: 'High priority: Emergency exits, fire safety equipment and evacuation information present, unobstructed and current', reason: 'Recorded in Safety, Security & Integrity as Missed. Ranked high priority.', findingCount: 1, sectionIds: ['safety'], affectedSections: ['Safety, Security & Integrity'] },
        { rank: 3, severity: 'moderate', title: 'Moderate priority: Exterior clean and well-maintained', reason: 'Recorded in Arrival & Entrance as Missed. Ranked moderate priority.', findingCount: 1, sectionIds: ['arrival'], affectedSections: ['Arrival & Entrance'] },
        { rank: 4, severity: 'moderate', title: 'Moderate priority: All lights and technology functioning', reason: 'Recorded in Room Quality as Missed. Ranked moderate priority.', findingCount: 1, sectionIds: ['room'], affectedSections: ['Room Quality'] },
        { rank: 5, severity: 'low', title: 'Low priority: Noise levels acceptable', reason: 'Recorded in Room Quality as Partial. Ranked low priority.', findingCount: 1, sectionIds: ['room'], affectedSections: ['Room Quality'] },
      ],
      urgentIssueCount: 2,
      improvementCount: 3,
      patterns: [
        { type: 'recurring', severity: 'high', explanation: '3 related failures recorded within Room Quality.', sectionIds: ['room'] },
        { type: 'inconsistent', severity: 'high', explanation: 'Performance varies significantly within Room Quality, suggesting an inconsistent guest experience rather than a uniformly weak one.', sectionIds: ['room'] },
        { type: 'cross_area', severity: 'high', explanation: 'Condition-related findings appear across 3 areas of the stay.', sectionIds: ['arrival', 'room', 'safety'] },
      ],
      strengths: [
        { sectionId: 'pre', title: 'Consistently strong performance in Pre-Arrival & Website', reason: '4 of 4 assessed items met the standard in Pre-Arrival & Website, with no missed or partial items.', assessedCount: 4 },
      ],
      sectionsToWatch: [
        { sectionId: 'room', sectionLabel: 'Room Quality', severity: 'high', findingCount: 3 },
        { sectionId: 'safety', sectionLabel: 'Safety, Security & Integrity', severity: 'high', findingCount: 1 },
      ],
    });

    const v2 = (over = {}) => payload({
      formatVersion: 2,
      score: { percent: 68, itemsMet: 13, itemsGraded: 19 },
      standardMet: false,
      intelligence: INTEL(),
      ...over,
    });

    const liveItems = [
      { item_id: 'RM-01', section_id: 'room', status: 'missed' },
      { item_id: 'RM-02', section_id: 'room', status: 'missed' },
    ];

    const CASES = {
      'A · full, frozen, passing': () => [row(), []],
      'B · property changed since': () => [row({
        properties: { name: 'Renamed Hotel', city: 'Akureyri', country: 'Norway', category: '4★' },
      }), []],
      'C · items changed since': () => [row(), liveItems],
      'D · spot, passing, no Mark': () => [row({ published_result: payload({ auditType: 'spot' }) }), []],
      'E · full, failing': () => [row({
        published_result: payload({
          standardMet: false,
          score: { percent: 58, itemsMet: 47, itemsGraded: 81 },
          criticalFailures: [
            { itemId: 'RM-02', label: 'No hair, stains, or odors', note: 'Bathroom, room 402.' },
          ],
        }),
      }), []],
      'F · desk review': () => [row({ published_result: payload({ auditType: 'desk' }) }), []],
      'G · legacy, null payload': () => [row({
        published_result: null,
        properties: { name: 'Hotel Borealis', city: 'Reykjavik', country: 'Iceland', category: '5★' },
        critical_failures: [{ itemId: 'RM-02', label: 'No hair, stains, or odors' }],
      }), [
        { item_id: 'RM-01', section_id: 'room', status: 'met' },
        { item_id: 'RM-02', section_id: 'room', status: 'missed' },
        { item_id: 'FAC-01', section_id: 'facilities', status: 'met' },
        { item_id: 'SAF-01', section_id: 'safety', status: 'met' },
      ]],
      'H · malformed payload': () => [row({ published_result: { nope: true } }), liveItems],
      'I · unknown formatVersion': () => [row({ published_result: payload({ formatVersion: 3 }) }), liveItems],
      'K · strong audit, multiple strengths, no findings': () => [row({
        published_result: payload({
          score: { percent: 98, itemsMet: 44, itemsGraded: 45 },
          criticalFailures: [],
          sections: [
            { id: 'pre', label: 'Pre-Arrival & Website', total: 12, met: 12, partial: 0, missed: 0, na: 0 },
            { id: 'arrival', label: 'Arrival & Entrance', total: 9, met: 9, partial: 0, missed: 0, na: 0 },
            { id: 'room', label: 'Room Quality', total: 9, met: 8, partial: 1, missed: 0, na: 0 },
            { id: 'safety', label: 'Safety, Security & Integrity', total: 3, met: 3, partial: 0, missed: 0, na: 0 },
            { id: 'breakfast', label: 'Breakfast', total: 12, met: 12, partial: 0, missed: 0, na: 0 },
          ],
        }),
      }), []],
      'L · mixed audit, several attention sections': () => [row({
        published_result: payload({
          standardMet: false,
          score: { percent: 63, itemsMet: 25, itemsGraded: 40 },
          criticalFailures: [
            { itemId: 'SAF-01', label: 'Emergency exits, fire safety equipment', note: 'Corridor exit sign not illuminated.' },
          ],
          sections: [
            { id: 'pre', label: 'Pre-Arrival & Website', total: 12, met: 12, partial: 0, missed: 0, na: 0 },
            { id: 'room', label: 'Room Quality', total: 9, met: 5, partial: 1, missed: 3, na: 0 },
            { id: 'facilities', label: 'Facilities', total: 6, met: 3, partial: 1, missed: 2, na: 0 },
            { id: 'safety', label: 'Safety, Security & Integrity', total: 3, met: 2, partial: 0, missed: 1, na: 0 },
            { id: 'spa', label: 'Spa & Wellness', total: 10, met: 3, partial: 1, missed: 1, na: 5 },
          ],
        }),
      }), []],
      'J · incomplete basis': () => [row({
        published_result: payload({ basis: { state: 'incomplete', recordedOn: null } }),
      }), []],
      // Phase 6.8. Transcribed from what the audit console actually emits, so
      // the harness shows the real block rather than an idealised one.
      'P · v2, published intelligence': () => [row({ published_result: v2() }), liveItems],
      'Q · v2, no intelligence block': () => [row({ published_result: payload({ formatVersion: 2 }) }), liveItems],
      'R · v2, malformed intelligence': () => [row({
        published_result: v2({ intelligence: { headline: '', priorities: 'many' } }),
      }), liveItems],
      // Phase 6.9 edge states.
      'S · v2, clean audit, nothing to act on': () => [row({
        published_result: v2({
          score: { percent: 96, itemsMet: 43, itemsGraded: 45 },
          standardMet: true,
          intelligence: {
            ...INTEL(),
            headline: 'A consistently strong guest experience across this stay.',
            summary: { overallPerformance: 'Strong', positiveSignal: 'Consistently strong performance in Pre-Arrival & Website' },
            keyMetrics: { urgentIssueCount: 0, priorityCount: 0, patternCount: 0, strengthCount: 3, notAssessedCount: 0, notAvailableCount: 0 },
            priorities: [], urgentIssueCount: 0, improvementCount: 0, patterns: [], sectionsToWatch: [],
            strengths: [
              { sectionId: 'pre', title: 'Consistently strong performance in Pre-Arrival & Website', reason: '12 of 12 assessed items met the standard in Pre-Arrival & Website, with no missed or partial items.', assessedCount: 12 },
              { sectionId: 'spa', title: 'Consistently strong performance in Spa & Wellness', reason: '11 of 11 assessed items met the standard in Spa & Wellness, with no missed or partial items.', assessedCount: 11 },
              { sectionId: 'room', title: 'Consistently strong performance in Room Quality', reason: '9 of 9 assessed items met the standard in Room Quality, with no missed or partial items.', assessedCount: 9 },
            ],
          },
        }),
      }), []],
      'T · v2, low score, more priorities than shown': () => [row({
        published_result: v2({
          score: { percent: 38, itemsMet: 15, itemsGraded: 40 },
          standardMet: false,
          criticalFailures: [{ itemId: 'SAF-01', label: 'SAF-01', note: null }],
          sections: [
            { id: 'room', label: 'Room Quality', total: 12, met: 4, partial: 2, missed: 5, na: 1 },
            { id: 'safety', label: 'Safety, Security & Integrity', total: 3, met: 1, partial: 0, missed: 2, na: 0 },
            { id: 'spa', label: 'Spa & Wellness', total: 11, met: 2, partial: 1, missed: 1, na: 7 },
          ],
          intelligence: {
            ...INTEL(),
            headline: 'Overall performance requires attention, with 3 high priority issues to address.',
            keyMetrics: { urgentIssueCount: 3, priorityCount: 7, patternCount: 3, strengthCount: 0, notAssessedCount: 3, notAvailableCount: 5 },
            urgentIssueCount: 3, improvementCount: 2, strengths: [],
          },
        }),
      }), []],
    };

    const bar = document.getElementById('harness-bar');
    const state = document.getElementById('harness-state');

    function show(name) {
      const [auditRow, items] = CASES[name]();
      const result = interpretReport(auditRow, items);
      window.__harness = result;
      state.textContent = `${name}  →  mode=${result.mode}`
        + (result.reason ? ` reason=${result.reason}` : '')
        + (result.view ? ` showMark=${result.view.showMark} score=${result.view.score.percent} sections=${result.view.sections.length}` : '');
      if (result.mode === 'unavailable') {
        if (result.reason === 'not-found') renderNotFound(root); else renderUnsupported(root);
      } else {
        renderReport(root, result.view);
      }
      [...bar.children].forEach(b => b.setAttribute('aria-pressed', String(b.textContent === name)));
    }

    Object.keys(CASES).forEach(name => {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = () => show(name);
      bar.appendChild(b);
    });
    window.__show = show;

    // ?case=P opens a case directly; &bare=1 drops the harness controls and
    // lays the report out exactly as report.html does, for screenshots and
    // print-to-PDF runs from a headless browser.
    const params = new URLSearchParams(location.search);
    const wanted = params.get('case');
    const initial = Object.keys(CASES).find((k) => wanted && k.startsWith(`${wanted} `)) || 'A · full, frozen, passing';
    if (params.get('bare') === '1') {
      bar.style.display = 'none';
      state.style.display = 'none';
      document.body.style.padding = '0';
      root.className = 'report-main';
    }
    show(initial);
  </script>
</body>
</html>
